<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>TOPlive - Trasmissão</title>

        <style>
            body{
                font-family: 'Segoe UI', Tahoma, sans-serif;
                background-color: #121212;
                color: #ffffffff;
                text-align: center;
                padding: 20px;
            }
            .painel-controle{
                background-color: #1e1e1e;
                padding: 20px;
                border-radius: 12px;
                max-width: 500px;
                margin: 0 auto;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 5); 
            }

            button{
                background-color: #007bff;
                color: white;
                border: none;
                padding: 12px 20px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 6px;
                cursor: pointer;
                width: 100%;
                margin-bottom: 10px;
                transition: 0.3s;
            }

            button:hover {
                background-color: #0056b3;
            }

            imput{
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #444;
                background-color: #2a2a2a;
                color: white;
                font-size: 16px;
                margin-bottom: 15px;
            }

            video{
                width: 100%;
                max-width: 800px;
                margin-top: 30px;
                background-color: #000;
                border: 2px solid #333;
                border-radius: 8px;
            }
            
        </style>
    </head>
    <body>
        <h1>🎥 TOPlive</h1>
        
    <div class="painel-controle"> 
        <p>O seu ID de conexão é: <b>Aguardando...</b></p>

        <h3>Para compartilhar sua Tela:</h3>
        <button>1. Iniciar Transmissão</button>
        
        <h3>Para Assistir alguém:</h3>
        <input type="text" placeholder="Cole o ID de quem está transmitindo">
        <button style="background-color: #28a745"> 2. Conectar e Assistir</button>
     </div>
        <video autoplay playsinline controls></video>
    </body>
</html>
